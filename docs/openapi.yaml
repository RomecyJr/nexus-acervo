openapi: 3.1.0
info:
  title: Nexus Acervo Public Data API
  version: 1.5.0
  description: Endpoint canônico público e estático do catálogo Nexus Acervo para consumo por agentes de IA e integrações externas.
servers:
  - url: https://nexus-acervo.vercel.app
    description: Servidor de Produção (Vercel)
  - url: http://localhost:3000
    description: Ambiente de Desenvolvimento Local
paths:
  /data/catalog.json:
    get:
      summary: Retorna o catálogo completo do acervo em JSON
      description: Fornece metadados, segmentos normalizados e todos os recursos catalogados (ferramentas, repositórios, vídeos, carrosséis e conhecimento).
      responses:
        '200':
          description: Catálogo completo estruturado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
components:
  schemas:
    CatalogResponse:
      type: object
      required: [meta, segments, items]
      properties:
        meta:
          type: object
          required: [name, version, generatedAt, language]
          properties:
            name: { type: string, example: "Nexus Acervo" }
            version: { type: string, example: "1.5.0" }
            generatedAt: { type: string, format: date-time }
            language: { type: string, example: "pt-BR" }
            sourceFile: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, example: "seg-design" }
              label: { type: string, example: "Design e UX" }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Item:
      type: object
      required: [id, title, kind, segment, url, description, tags, status, year, source, addedAt, updatedAt]
      properties:
        id: { type: string, example: "repo-documenso" }
        title: { type: string, example: "Documenso — Assinatura Digital Open Source" }
        kind:
          type: string
          enum: [ferramenta, vídeo, repositório, conhecimento, diretório, carrossel]
        segment: { type: string, example: "Desenvolvimento e Infra" }
        url: { type: string, format: uri, example: "https://github.com/documenso/documenso" }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string, example: "ativo" }
        year: { type: integer, example: 2026 }
        source: { type: string, example: "Relatório consolidado" }
        addedAt: { type: string, format: date, example: "2026-09-23" }
        updatedAt: { type: string, format: date, example: "2026-09-24" }
        deliverable: { type: string }
        practicalExample: { type: string }
        youtubeId: { type: string }
        thumbnail: { type: string }
        targetAudience: { type: string }
        slides:
          type: array
          items: { type: string }
